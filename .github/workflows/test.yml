name: Test
on:
  pull_request:
    paths: [scripts/**]
  push:
    branches: [main]
    paths: [scripts/**]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/lib.test.mjs
